<?xml version="1.0" encoding="UTF-8"?>
<!--
  NEW ALCHEMY DISTILLING — Sierra Foothills engraving
  Standalone VECTOR etching (pure SVG line art, transparent background).
  viewBox 0 0 98 150 (portrait). Recolor via the group's stroke value.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2.45in" height="3.75in"
     viewBox="0 0 98 150" preserveAspectRatio="xMidYMid meet">

  <g stroke="#2f2516" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1">

    <!-- sun + rays -->
    <circle cx="70" cy="33" r="9" stroke-width="1.3"/>
    <g stroke-width="1.1">
      <line x1="70" y1="19" x2="70" y2="13"/>
      <line x1="82" y1="25" x2="87" y2="20"/>
      <line x1="58" y1="25" x2="53" y2="20"/>
      <line x1="84" y1="33" x2="91" y2="33"/>
      <line x1="56" y1="33" x2="49" y2="33"/>
      <line x1="82" y1="41" x2="87" y2="46"/>
      <line x1="58" y1="41" x2="53" y2="46"/>
    </g>
    <g stroke-width="0.8">
      <line x1="63" y1="33" x2="77" y2="33"/>
      <line x1="64" y1="29" x2="76" y2="29"/>
      <line x1="64" y1="37" x2="76" y2="37"/>
    </g>

    <!-- birds -->
    <g stroke-width="0.9">
      <path d="M14 28 q3.5 -3.5 7 0 q3.5 -3.5 7 0"/>
      <path d="M25 21 q3 -3 6 0 q3 -3 6 0"/>
    </g>

    <!-- distant range -->
    <path stroke-width="1.2"
          d="M3 63 L14 48 L23 57 L34 42 L45 56 L56 45 L67 59 L79 48 L89 59 L95 53"/>
    <g stroke-width="0.8">
      <line x1="34" y1="44" x2="29" y2="56"/>
      <line x1="38" y1="47" x2="33" y2="57"/>
      <line x1="56" y1="47" x2="51" y2="58"/>
      <line x1="60" y1="50" x2="55" y2="59"/>
    </g>

    <!-- front ridge / foothills -->
    <path stroke-width="1.6" d="M3 87 L20 69 L35 82 L53 65 L71 84 L85 73 L95 84"/>
    <g stroke-width="0.85">
      <line x1="53" y1="67" x2="46" y2="83"/>
      <line x1="57" y1="71" x2="50" y2="84"/>
      <line x1="61" y1="75" x2="55" y2="85"/>
      <line x1="20" y1="71" x2="14" y2="85"/>
      <line x1="24" y1="75" x2="18" y2="86"/>
    </g>

    <!-- ground line -->
    <line stroke-width="1.4" x1="3" y1="97" x2="95" y2="97"/>

    <!-- barn -->
    <g stroke-width="1.2">
      <rect x="21" y="85" width="24" height="12"/>
      <path d="M21 85 L33 77 L45 85"/>
      <rect x="29" y="90" width="6" height="7"/>
      <line x1="21" y1="91" x2="45" y2="91"/>
    </g>
    <!-- silo -->
    <g stroke-width="1.1">
      <rect x="47" y="83" width="7" height="14"/>
      <path d="M47 83 q3.5 -4.5 7 0"/>
    </g>

    <!-- fir trees -->
    <g stroke-width="1">
      <path d="M12 97 L12 83 M6 95 L12 85 L18 95 M8 91 L12 84 L16 91"/>
      <path d="M62 97 L62 85 M57 95 L62 87 L67 95 M58.5 91 L62 86 L65.5 91"/>
      <path d="M71 97 L71 87 M67.5 96 L71 89 L74.5 96"/>
    </g>

    <!-- orchard rows / foreground furrows -->
    <g stroke-width="0.9">
      <path d="M3 150 L40 101"/>
      <path d="M23 150 L47 101"/>
      <path d="M49 150 L52 101"/>
      <path d="M75 150 L58 101"/>
      <path d="M95 150 L65 101"/>
    </g>
    <g stroke-width="0.7">
      <line x1="6" y1="112" x2="92" y2="112"/>
      <line x1="7" y1="123" x2="91" y2="123"/>
      <line x1="6" y1="134" x2="92" y2="134"/>
    </g>
    <!-- apple-tree rounds -->
    <g stroke-width="1">
      <circle cx="20" cy="105" r="3.6"/>
      <line x1="20" y1="108.6" x2="20" y2="112"/>
      <circle cx="74" cy="105" r="3.6"/>
      <line x1="74" y1="108.6" x2="74" y2="112"/>
      <circle cx="47" cy="113" r="4"/>
      <line x1="47" y1="117" x2="47" y2="121"/>
    </g>

    <!-- fence -->
    <g stroke-width="0.8">
      <line x1="4" y1="101" x2="44" y2="101"/>
      <line x1="11" y1="98" x2="11" y2="104"/>
      <line x1="22" y1="98" x2="22" y2="104"/>
      <line x1="33" y1="98" x2="33" y2="104"/>
      <line x1="43" y1="98" x2="43" y2="104"/>
    </g>
  </g>
</svg>
