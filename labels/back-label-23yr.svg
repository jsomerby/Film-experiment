<?xml version="1.0" encoding="UTF-8"?>
<!--
  NEW ALCHEMY DISTILLING — Apple Brandy "23 YEAR" BACK LABEL
  Die shape: 2.8" x 3.9" tapered (tumbler) label.
  Layout: text on the LEFT, etched landscape illustration on the RIGHT.

  Units: viewBox is in 1/100 inch (280 x 390 = 2.8" x 3.9").

  FONTS USED (all free Google Fonts — swap for your licensed equivalents):
    - "Playfair Display"  -> display title (high-contrast didone serif)   ~ matches "APPLE BRANDY / 23 YEAR"
    - "Cinzel"            -> engraved roman caps (distillery name, labels) ~ matches the inscriptional caps
    - "EB Garamond"       -> old-style serif body copy                     ~ matches the running text
  See labels/README.md for the full font map.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2.8in" height="3.9in" viewBox="0 0 280 390" preserveAspectRatio="xMidYMid meet">

  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@0,400;700;900&display=swap');

      text { fill: #2b2521; }
      .brand   { font-family: 'Cinzel', 'Times New Roman', serif; }
      .display { font-family: 'Playfair Display', Georgia, serif; }
      .body    { font-family: 'EB Garamond', Georgia, serif; }
      .ink     { fill: none; stroke: #2b2521; }
    ]]></style>

    <!-- Tapered die line -->
    <path id="die" d="M0 0 H280 L268 390 H12 Z"/>
    <clipPath id="clip"><use xlink:href="#die"/></clipPath>
  </defs>

  <!-- ===== PAPER ===== -->
  <use xlink:href="#die" fill="#f3ead4"/>

  <g clip-path="url(#clip)">
    <!-- subtle aged tint at edges -->
    <use xlink:href="#die" fill="none" stroke="#d8c9a3" stroke-width="10" opacity="0.45"/>
  </g>

  <!-- ===== BORDER (double rule, follows the taper) ===== -->
  <path class="ink" stroke-width="1.6"
        d="M8 8 H272 L261.5 382 H18.5 Z"/>
  <path class="ink" stroke-width="0.5"
        d="M12 12 H268 L257.7 378 H22.3 Z"/>

  <!-- ===================== HEADER ===================== -->
  <text class="brand" x="140" y="26" text-anchor="middle"
        font-size="9.5" font-weight="600" letter-spacing="1.6">NEW ALCHEMY DISTILLING</text>
  <text class="body" x="140" y="34.5" text-anchor="middle"
        font-size="6" letter-spacing="2.2">EL DORADO HILLS, CALIFORNIA</text>

  <!-- ornamental rule -->
  <g class="ink" stroke-width="0.6">
    <line x1="40" y1="40" x2="132" y2="40"/>
    <line x1="148" y1="40" x2="240" y2="40"/>
  </g>
  <path d="M140 37 l3 3 -3 3 -3 -3 Z" fill="#2b2521"/>

  <!-- ===================== TITLE BLOCK ===================== -->
  <text class="display" x="140" y="58" text-anchor="middle"
        font-size="20" font-weight="900" letter-spacing="1">APPLE BRANDY</text>

  <text class="display" x="140" y="82" text-anchor="middle"
        font-size="22" font-weight="700" letter-spacing="3">23 YEAR</text>

  <g class="ink" stroke-width="0.6">
    <line x1="56" y1="88" x2="104" y2="88"/>
    <line x1="176" y1="88" x2="224" y2="88"/>
  </g>
  <path d="M140 85.5 l2.4 2.5 -2.4 2.5 -2.4 -2.5 Z" fill="#2b2521"/>
  <text class="brand" x="140" y="96.5" text-anchor="middle"
        font-size="6.4" font-weight="400" letter-spacing="1.4">CAVE AGED IN FRENCH OAK BARRELS</text>

  <!-- ===================== BODY (LEFT) + ETCHING (RIGHT) ===================== -->

  <!-- left column heading -->
  <g class="ink" stroke-width="0.5">
    <line x1="26" y1="106" x2="34" y2="106"/>
    <line x1="118" y1="106" x2="126" y2="106"/>
  </g>
  <text class="brand" x="76" y="108.6" text-anchor="middle"
        font-size="6.6" font-weight="600" letter-spacing="1">FROM THE FOOTHILLS</text>

  <!-- body copy, manually wrapped (~36 chars/line) -->
  <text class="body" x="26" y="120" font-size="6.7" letter-spacing="0.1">
    <tspan x="26" dy="0">This is your opportunity to try what</tspan>
    <tspan x="26" dy="8.4">is almost certainly the oldest and we</tspan>
    <tspan x="26" dy="8.4">believe some of the best historical</tspan>
    <tspan x="26" dy="8.4">examples of California apple brandy</tspan>
    <tspan x="26" dy="8.4">on the market. Limited to only 1,000</tspan>
    <tspan x="26" dy="8.4">bottles, it&#8217;s a relic that will never</tspan>
    <tspan x="26" dy="8.4">be available after these limited lots</tspan>
    <tspan x="26" dy="8.4">are gone.</tspan>

    <tspan x="26" dy="13.5">Distilled from heritage apples grown</tspan>
    <tspan x="26" dy="8.4">in the cool elevations of Apple Hill</tspan>
    <tspan x="26" dy="8.4">and laid down for decades in French</tspan>
    <tspan x="26" dy="8.4">oak barrels deep within the Sierra</tspan>
    <tspan x="26" dy="8.4">foothills, this release represents a</tspan>
    <tspan x="26" dy="8.4">vanishing chapter of California</tspan>
    <tspan x="26" dy="8.4">distilling history&#8212;crafted with</tspan>
    <tspan x="26" dy="8.4">patience, tradition, and a deep</tspan>
    <tspan x="26" dy="8.4">respect for this remarkable place.</tspan>
  </text>

  <!-- ============ ETCHING (RIGHT) ============ -->
  <!-- local drawing space 0..100 (w) x 0..150 (h), placed at (158,108) -->
  <g transform="translate(158,108)">
    <!-- vignette frame -->
    <rect x="0" y="0" width="98" height="150" rx="2" fill="#f7f0dd" stroke="#2b2521" stroke-width="1.1"/>
    <rect x="3" y="3" width="92" height="144" rx="1" fill="none" stroke="#2b2521" stroke-width="0.4"/>

    <g clip-path="none">
      <g stroke="#2b2521" fill="none" stroke-linecap="round" stroke-linejoin="round">

        <!-- sun + rays -->
        <circle cx="70" cy="34" r="9" stroke-width="0.7"/>
        <g stroke-width="0.45">
          <line x1="70" y1="20" x2="70" y2="14"/>
          <line x1="82" y1="26" x2="87" y2="22"/>
          <line x1="58" y1="26" x2="53" y2="22"/>
          <line x1="84" y1="34" x2="90" y2="34"/>
          <line x1="56" y1="34" x2="50" y2="34"/>
          <line x1="82" y1="42" x2="87" y2="46"/>
        </g>
        <!-- sun inner hatch -->
        <g stroke-width="0.3">
          <line x1="64" y1="34" x2="76" y2="34"/>
          <line x1="65" y1="30" x2="75" y2="30"/>
          <line x1="65" y1="38" x2="75" y2="38"/>
        </g>

        <!-- birds -->
        <g stroke-width="0.4">
          <path d="M16 30 q3 -3 6 0 q3 -3 6 0"/>
          <path d="M26 24 q2.5 -2.5 5 0 q2.5 -2.5 5 0"/>
        </g>

        <!-- distant range -->
        <path stroke-width="0.6"
              d="M3 64 L14 50 L22 58 L33 44 L44 57 L55 47 L66 60 L78 50 L88 60 L95 55"/>
        <!-- range hatch -->
        <g stroke-width="0.3">
          <line x1="33" y1="46" x2="29" y2="56"/>
          <line x1="36" y1="48" x2="32" y2="57"/>
          <line x1="55" y1="49" x2="51" y2="58"/>
          <line x1="58" y1="51" x2="54" y2="59"/>
        </g>

        <!-- front ridge / foothills -->
        <path stroke-width="0.8" d="M3 86 L20 70 L34 82 L52 66 L70 84 L84 74 L95 84"/>
        <!-- ridge shading -->
        <g stroke-width="0.32">
          <line x1="52" y1="68" x2="46" y2="82"/>
          <line x1="55" y1="71" x2="49" y2="83"/>
          <line x1="58" y1="74" x2="53" y2="84"/>
          <line x1="20" y1="72" x2="15" y2="84"/>
          <line x1="23" y1="75" x2="18" y2="85"/>
        </g>

        <!-- ground line -->
        <line stroke-width="0.7" x1="3" y1="96" x2="95" y2="96"/>

        <!-- barn -->
        <g stroke-width="0.6">
          <rect x="22" y="86" width="22" height="10"/>
          <path d="M22 86 L33 79 L44 86"/>
          <rect x="30" y="90" width="5" height="6"/>
          <line x1="22" y1="91" x2="44" y2="91"/>
        </g>
        <!-- silo -->
        <g stroke-width="0.55">
          <rect x="46" y="84" width="6" height="12"/>
          <path d="M46 84 q3 -4 6 0"/>
        </g>
        <!-- barn hatch -->
        <g stroke-width="0.28">
          <line x1="24" y1="93" x2="42" y2="93"/>
          <line x1="24" y1="94.5" x2="42" y2="94.5"/>
        </g>

        <!-- fir trees -->
        <g stroke-width="0.5">
          <path d="M12 96 L12 84 M7 94 L12 86 L17 94 M8.5 90 L12 85 L15.5 90"/>
          <path d="M62 96 L62 86 M58 94 L62 88 L66 94 M59 91 L62 87 L65 91"/>
          <path d="M70 96 L70 88 M67 95 L70 90 L73 95"/>
        </g>

        <!-- orchard rows / foreground furrows (converging) -->
        <g stroke-width="0.4">
          <path d="M3 150 L40 100"/>
          <path d="M22 150 L46 100"/>
          <path d="M48 150 L52 100"/>
          <path d="M74 150 L58 100"/>
          <path d="M95 150 L64 100"/>
        </g>
        <!-- foreground cross hatch -->
        <g stroke-width="0.28">
          <line x1="6" y1="110" x2="92" y2="110"/>
          <line x1="8" y1="120" x2="90" y2="120"/>
          <line x1="6" y1="131" x2="92" y2="131"/>
          <line x1="8" y1="142" x2="90" y2="142"/>
        </g>
        <!-- little apple-tree rounds -->
        <g stroke-width="0.45">
          <circle cx="20" cy="104" r="3"/>
          <line x1="20" y1="107" x2="20" y2="110"/>
          <circle cx="74" cy="104" r="3"/>
          <line x1="74" y1="107" x2="74" y2="110"/>
          <circle cx="47" cy="112" r="3.4"/>
          <line x1="47" y1="115.4" x2="47" y2="119"/>
        </g>

        <!-- fence -->
        <g stroke-width="0.4">
          <line x1="4" y1="100" x2="44" y2="100"/>
          <line x1="10" y1="98" x2="10" y2="103"/>
          <line x1="20" y1="98" x2="20" y2="103"/>
          <line x1="30" y1="98" x2="30" y2="103"/>
          <line x1="40" y1="98" x2="40" y2="103"/>
        </g>
      </g>
    </g>
    <!-- etching caption -->
    <text class="body" x="49" y="142" text-anchor="middle" font-size="4.6"
          letter-spacing="0.6" font-style="italic">the Sierra foothills</text>
  </g>

  <!-- ===================== FOOTER ===================== -->

  <!-- specs box -->
  <g class="ink" stroke-width="0.7">
    <rect x="26" y="296" width="228" height="26"/>
    <line x1="116" y1="296" x2="116" y2="322"/>
    <line x1="170" y1="296" x2="170" y2="322"/>
  </g>

  <!-- col 1 -->
  <text class="brand" x="30" y="303.5" font-size="4.4" letter-spacing="0.6" fill="#6b5c44">BARRELED IN</text>
  <text class="display" x="30" y="312" font-size="9" font-weight="700">2003</text>
  <text class="brand" x="30" y="319.5" font-size="4.8" letter-spacing="0.5">48% ALC/VOL · 96 PROOF</text>
  <!-- col 2 -->
  <text class="display" x="143" y="312" text-anchor="middle" font-size="9.5" font-weight="700">750 ML</text>
  <!-- col 3 -->
  <text class="brand" x="174" y="303.5" font-size="4.4" letter-spacing="0.6" fill="#6b5c44">BARREL NUMBER</text>
  <text class="display" x="174" y="312" font-size="9" font-weight="700">C-37</text>
  <text class="brand" x="174" y="319.5" font-size="4.8" letter-spacing="0.5">BOTTLE No. 142 OF 1,000</text>

  <!-- producer -->
  <text class="body" x="140" y="331" text-anchor="middle" font-size="4.6" letter-spacing="1.4">PRODUCED AND BOTTLED BY</text>
  <text class="brand" x="140" y="338.5" text-anchor="middle" font-size="6.6" font-weight="600" letter-spacing="1">NEW ALCHEMY DISTILLING</text>
  <text class="body" x="140" y="345" text-anchor="middle" font-size="4.6" letter-spacing="1.1">EL DORADO HILLS, CALIFORNIA · PRODUCT OF CALIFORNIA, USA</text>

  <line class="ink" stroke-width="0.4" x1="40" y1="350" x2="240" y2="350"/>

  <!-- government warning -->
  <text class="body" x="140" y="356.5" text-anchor="middle" font-size="3.7" letter-spacing="0.1">
    <tspan x="140" dy="0"><tspan font-weight="500">GOVERNMENT WARNING:</tspan> (1) According to the Surgeon General, women should not drink</tspan>
    <tspan x="140" dy="4.6">alcoholic beverages during pregnancy because of the risk of birth defects. (2) Consumption</tspan>
    <tspan x="140" dy="4.6">of alcoholic beverages impairs your ability to drive a car or operate machinery, and may</tspan>
    <tspan x="140" dy="4.6">cause health problems.</tspan>
  </text>

  <!-- DSP / lot -->
  <text class="brand" x="28" y="374" font-size="4" letter-spacing="0.5" fill="#6b5c44">DSP-CA-20107</text>
  <text class="brand" x="252" y="374" text-anchor="end" font-size="4" letter-spacing="0.5" fill="#6b5c44">PACKAGED IN APPLE HILL</text>

</svg>
