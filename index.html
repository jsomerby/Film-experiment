<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Background Video — Demo</title>

  <!--
    SEO / performance note:
    The POSTER image is the real Largest Contentful Paint (LCP) element, not the
    video. Keep it a well-compressed WebP/AVIF so the page paints fast even before
    the video buffers. The <video> is decorative, so it carries aria-hidden and is
    never the LCP. This is why a 1080p (not 4K) loop is the right call for SEO.
  -->
  <link rel="preload" as="image" href="assets/img/hero-poster.webp" fetchpriority="high" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;          /* fills the screen, respects mobile browser UI */
      min-height: 100vh;
      overflow: hidden;
      background: #1a120b;       /* warm fallback while the poster loads */
    }

    /* The video fills the screen and stays sharp via cover-cropping. */
    .hero__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Warm scrim so overlaid text stays legible (and on-brand). */
    .hero__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(20, 12, 6, 0.25) 0%,
        rgba(20, 12, 6, 0.10) 40%,
        rgba(20, 12, 6, 0.55) 100%
      );
    }

    .hero__content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #f4ead7;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      padding: 0 1.25rem;
    }
    .hero__content h1 { font-size: clamp(2rem, 6vw, 4.5rem); letter-spacing: 0.02em; margin: 0; }
    .hero__content p  { font-size: clamp(1rem, 2.2vw, 1.4rem); opacity: 0.9; margin-top: 1rem; }

    /* Respect users who prefer reduced motion: show the still poster instead. */
    @media (prefers-reduced-motion: reduce) {
      .hero__video { display: none; }
      .hero { background-image: url("assets/img/hero-poster.webp"); background-size: cover; background-position: center; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <!--
      One <video>, two encodes selected by viewport via <source media=...>:
      the browser downloads only the matching source, so phones never pull the
      heavier 16:9 file. WebM (VP9/AV1) first for smaller size, MP4 (H.264) as the
      universal fallback. muted + playsinline are REQUIRED for mobile autoplay.
    -->
    <video
      class="hero__video"
      autoplay muted loop playsinline
      preload="metadata"
      poster="assets/img/hero-poster.webp"
      aria-hidden="true"
      tabindex="-1"
    >
      <!-- Mobile portrait -->
      <source src="assets/video/hero-mobile.webm" type="video/webm" media="(max-aspect-ratio: 1/1)" />
      <source src="assets/video/hero-mobile.mp4"  type="video/mp4"  media="(max-aspect-ratio: 1/1)" />
      <!-- Desktop / landscape -->
      <source src="assets/video/hero-desktop.webm" type="video/webm" />
      <source src="assets/video/hero-desktop.mp4"  type="video/mp4" />
    </video>

    <div class="hero__scrim"></div>

    <div class="hero__content">
      <h1>Small-Batch. By Hand.</h1>
      <p>Replace this headline with your copy.</p>
    </div>
  </section>
</body>
</html>
